[project]
name = "epam-final-project"
version = "0.1.0"
description = "Web app for VCF variant analysis"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.164.0,<0.165.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "sqlalchemy[asyncio] (>=2.1.9,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "pydantic-settings (>=2.16.3,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "ruff (>=0.17.6,<0.18.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.5.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "aiosqlite (>=0.22.1,<0.23.0)"
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
